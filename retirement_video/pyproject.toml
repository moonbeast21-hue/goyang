[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retirement-video-maker"
version = "0.1.0"
description = "퇴임식 기념영상 자동 제작 프로그램"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["retirement_video*"]

