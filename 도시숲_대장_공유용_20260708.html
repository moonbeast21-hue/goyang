<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', sans-serif; font-size: 14px; background: #f0f2f5; }

#app { display: flex; height: 100vh; }

/* ── 사이드바 ── */
#sidebar {
  width: 260px; min-width: 260px;
  background: #1e2736; color: #d4dce8;
  display: flex; flex-direction: column;
  overflow: hidden;
}
#sidebar-header {
  padding: 16px;
  background: #151d2b;
  border-bottom: 1px solid #2e3d52;
}
#sidebar-header h1 { font-size: 15px; color: #fff; font-weight: 700; }
#sidebar-header p  { font-size: 11px; color: #7a8fa8; margin-top: 3px; }

.sb-section { padding: 12px 14px; border-bottom: 1px solid #2e3d52; }
.sb-label { font-size: 11px; color: #7a8fa8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }

#sort-select {
  width: 100%; padding: 5px 6px; margin-top: 6px;
  background: #2a3548; border: 1px solid #3a4d63;
  color: #d4dce8; border-radius: 4px; font-size: 12px;
}

/* 대분류 체크박스 */
#category-list { display: flex; flex-direction: column; gap: 2px; }
.cat-check-row {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 2px; cursor: pointer; border-radius: 4px; font-size: 12px;
}
.cat-check-row:hover { background: #253040; }
.cat-check-row input[type="checkbox"] { accent-color: #2e8b57; }
.cat-swatch {
  width: 11px; height: 11px; border-radius: 3px; flex: none;
  border: 1px solid rgba(255,255,255,.25);
}
.cat-check-label { flex: 1; color: #d4dce8; }
.cat-check-count { color: #7a8fa8; font-size: 11px; }

#add-category-select {
  width: 100%; padding: 6px 8px; margin-top: 4px;
  background: #2a3548; border: 1px solid #3a4d63;
  color: #d4dce8; border-radius: 4px; font-size: 12px;
}

.cat-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 6px; border: 1px solid rgba(0,0,0,.2);
}

/* 검색 */
#search-input {
  width: 100%; padding: 8px 10px;
  background: #2a3548; border: 1px solid #3a4d63;
  color: #d4dce8; border-radius: 4px; font-size: 13px;
  margin-bottom: 6px;
}
#search-input::placeholder { color: #5a6d84; }
#search-input:focus { outline: none; border-color: #4a9eff; }
#search-btn {
  width: 100%; padding: 8px; background: #2e8b57; color: #fff;
  border: none; border-radius: 4px; cursor: pointer; font-weight: 700;
}
#search-btn:hover { background: #3aaa6a; }
#search-btn:disabled { background: #2e4a3a; cursor: not-allowed; color: #5a8a6a; }
#search-status { font-size: 11px; color: #f0a020; margin-top: 6px; min-height: 16px; }

/* 선택 삭제 툴바 */
#bulk-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
#select-all-label {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: #b0c0d4; cursor: pointer; white-space: nowrap;
}
#select-all-label input { accent-color: #2e8b57; }
#bulk-delete-btn {
  display: none; margin: 0; width: auto;
  padding: 5px 10px; font-size: 12px;
}

/* 목록 */
#list-wrap { flex: 1; overflow-y: auto; padding: 8px 0; }
.list-item {
  padding: 8px 14px; cursor: pointer;
  border-left: 3px solid transparent;
  transition: background .15s;
  display: flex; align-items: flex-start; gap: 8px;
}
.list-item:hover { background: #253040; }
.list-item.active { background: #253040; border-left-color: #2e8b57; }
.list-item-check { margin-top: 3px; flex: none; cursor: pointer; accent-color: #2e8b57; }
.list-item-main { flex: 1; min-width: 0; }
.list-item-name { font-size: 13px; color: #d4dce8; font-weight: 600; }
.list-item-sub  { font-size: 11px; color: #7a8fa8; margin-top: 2px; }
.list-empty { padding: 20px 14px; color: #5a6d84; font-size: 12px; text-align: center; }

/* 하단 버튼 */
#sidebar-footer { padding: 12px 14px; border-top: 1px solid #2e3d52; }
.footer-btn {
  width: 100%; padding: 8px; margin-bottom: 6px;
  background: #2a3548; color: #b0c0d4;
  border: 1px solid #3a4d63; border-radius: 4px;
  cursor: pointer; font-size: 12px;
}
.footer-btn:last-child { margin-bottom: 0; }
.footer-btn:hover { background: #344260; color: #fff; }
.footer-btn.danger { border-color: #7a2020; color: #e07070; }
.footer-btn.danger:hover { background: #4a1010; }

/* ── 지도 영역 ── */
#map-wrap { flex: 1; display: flex; flex-direction: column; position: relative; }
#map { flex: 1; }

/* ── 속성 패널 ── */
#attr-panel {
  background: #fff;
  border-top: 2px solid #2e8b57;
  padding: 14px 18px;
  min-height: 180px;
  box-shadow: 0 -2px 8px rgba(0,0,0,.1);
}
#attr-panel.hidden { display: none; }
#attr-panel-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
}
#attr-panel-title { font-size: 14px; font-weight: 700; color: #1e2736; }
#attr-panel-close {
  background: none; border: none; cursor: pointer;
  font-size: 18px; color: #888; line-height: 1;
}
#attr-form { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
.form-group { display: flex; flex-direction: column; }
.form-group.span2 { grid-column: span 2; }
.form-group label { font-size: 11px; color: #666; margin-bottom: 3px; }
.form-group input, .form-group select, .form-group textarea {
  padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;
  font-family: inherit; background: #fafafa;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: #2e8b57; background: #fff;
}
.form-group textarea { resize: none; height: 52px; }
#attr-area-display { padding: 6px 8px; background: #f0f0f0; border-radius: 4px; font-size: 13px; color: #444; }
#attr-actions { margin-top: 12px; display: flex; gap: 8px; }
.btn { padding: 7px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-primary { background: #2e8b57; color: #fff; }
.btn-primary:hover { background: #3aaa6a; }
.btn-secondary { background: #e8edf2; color: #444; }
.btn-secondary:hover { background: #d0d8e4; }
.btn-danger { background: #e05555; color: #fff; }
.btn-danger:hover { background: #c04040; }
.btn-warning { background: #e09020; color: #fff; }
.btn-warning:hover { background: #c07010; }

/* ── 지도 위 상태 뱃지 ── */
#map-badge {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(30,39,54,.85); color: #fff;
  padding: 6px 14px; border-radius: 20px; font-size: 12px;
  pointer-events: none; z-index: 500;
  transition: opacity .3s;
}
#map-badge.hidden { opacity: 0; }

/* ── 지도 컨트롤 오버라이드 ── */
.leaflet-draw-toolbar a { background-color: #2e8b57 !important; }
</style>

// 폴리곤 면적 계산 (WGS84 → m²)
function calcAreaM2(latlngs) {
  // Shoelace formula with Earth radius approximation
  const R = 6371000;
  const coords = latlngs[0]; // outer ring
  let area = 0;
  const n = coords.length;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const xi = coords[i].lng * Math.PI / 180 * R * Math.cos(coords[i].lat * Math.PI / 180);
    const yi = coords[i].lat * Math.PI / 180 * R;
    const xj = coords[j].lng * Math.PI / 180 * R * Math.cos(coords[j].lat * Math.PI / 180);
    const yj = coords[j].lat * Math.PI / 180 * R;
    area += xi * yj - xj * yi;
  }
  return Math.abs(area / 2);
}

// ── 지번 검색 → 필지 경계 ─────────────────────────────
async function searchParcel() {
  if (!API_KEY) {
    setStatus('먼저 API 키를 입력하세요.');
    return;
  }
  let addr = document.getElementById('search-input').value.trim();
  if (!addr) { setStatus('지번 주소를 입력하세요.'); return; }

  // 주소 자동 보정
  const hasSiDo = /^(서울|경기|인천|부산|대구|광주|대전|울산|세종|강원|충북|충남|전북|전남|경북|경남|제주)/.test(addr);
  if (!hasSiDo) {
    if (/^고양/.test(addr)) {
      addr = '경기도 ' + addr;                    // "고양시 덕양구..." → "경기도 고양시 덕양구..."
    } else if (/^(덕양|일산동|일산서)/.test(addr)) {
      addr = '경기도 고양시 ' + addr;             // "덕양구 화정동..." → "경기도 고양시 덕양구..."
    } else {
      addr = '경기도 고양시 덕양구 ' + addr;      // "화정동 860" → "경기도 고양시 덕양구 화정동 860"
    }
    document.getElementById('search-input').value = addr;
  }

  document.getElementById('search-btn').disabled = true;
  setStatus('주소 검색 중...');

  try {
    // STEP 1: getcoord API로 주소 → 좌표 변환
    const addrUrl = `${VWORLD_BASE}/req/address?service=address&request=getcoord` +
      `&version=2.0&crs=epsg:4326&key=${API_KEY}` +
      `&address=${encodeURIComponent(addr)}&type=parcel` +
      `&format=json&errorformat=json`;

    const r1 = await fetch(addrUrl);
    const d1 = await r1.json();
    console.log('[Vworld getcoord 응답]', JSON.stringify(d1, null, 2));

    const status = (d1.response?.status || '').toUpperCase();
    if (status !== 'OK' || !d1.response?.result?.point) {
      const errText = d1.response?.error?.text || '결과 없음';
      setStatus(`주소를 찾지 못했습니다 (${errText}). 전체 주소로 입력해보세요. 예: 경기도 고양시 덕양구 화정동 860`);
      return;
    }

    const pt  = d1.response.result.point;
    const lng = parseFloat(pt.x);
    const lat = parseFloat(pt.y);

    // 역지오코딩으로 지번 주소 획득 (도로명 입력 시 변환)
    setStatus('지번 주소 변환 중...');
    const parcelAddr = await reverseToParcel(lng, lat);
    const refinedAddr = parcelAddr || addr;
    if (parcelAddr) setStatus(`지번 변환: ${parcelAddr}`);

    // 고양시 좌표 범위 검증 (위도 37.58~37.78, 경도 126.72~126.98)
    const inGoyang = lat >= 37.58 && lat <= 37.78 && lng >= 126.72 && lng <= 126.98;
    if (!inGoyang) {
      setStatus(`❗ 고양시 외부 위치가 검색됐습니다 (위도 ${lat.toFixed(4)}, 경도 ${lng.toFixed(4)}). 주소를 다시 확인해주세요.`);
      return;
    }

    // STEP 2: 해당 위치로 줌인 + 그리기 모드 시작
    // (WFS 필지 자동 경계는 API 미지원으로 제거 — 지도를 보며 직접 그리기)
    map.setView([lat, lng], 18);

    const marker = L.circleMarker([lat, lng], {
      radius: 8, color: '#f0a020', fillColor: '#f0a020', fillOpacity: 0.9, weight: 2
    }).addTo(map)
      .bindPopup(`📍 ${refinedAddr}<br><small>주황점 = 입력한 지번 위치<br>지도를 보며 경계를 그려주세요</small>`)
      .openPopup();

    setStatus('');
    badge('지번 위치를 찾았습니다. 지도를 보며 경계를 클릭해 그리세요 (더블클릭으로 완료)');
    setTimeout(() => startManualDraw(refinedAddr), 700);

  } catch (err) {
    setStatus('오류: ' + err.message);
    console.error(err);
  } finally {
    document.getElementById('search-btn').disabled = false;
  }
}

// ── 학교숲 추가 (Geom) ─────────────────────────────────
function addForestFromGeom(geom, addr, pnu) {
  // GeoJSON geometry → Leaflet polygon
  let latlngs;
  if (geom.type === 'Polygon') {
    latlngs = geom.coordinates[0].map(([lng, lat]) => [lat, lng]);
  } else if (geom.type === 'MultiPolygon') {
    latlngs = geom.coordinates[0][0].map(([lng, lat]) => [lat, lng]);
  } else return;

  const category = getSelectedAddCategory();
  const id = uid();
  const layer = L.polygon(latlngs, polygonStyle(false, category));
  addToCategory(layer, category);
  const areaM2 = Math.round(calcAreaM2(layer.getLatLngs()));

  const props = {
    id, addr_parcel: addr, pnu, category,
    school_name: '', school_type: SUBTYPE_OPTIONS[category][0],
    established_year: '', area_m2: areaM2,
    manager: '', care_status: '정상', note: '',
    created: today(), updated: today()
  };

  features.push({ id, props, layer });
  bindLayerEvents(id, layer);
  map.fitBounds(layer.getBounds(), { padding: [40, 40] });
  selectFeature(id);
  updateList();
  saveToStorage();
  badge('필지 경계를 불러왔습니다. 정보를 입력 후 저장하세요.', 4000);
}

  if (manualDrawMode) return;

    updateList();

  });
}

// ── 선택 & 스타일 ──────────────────────────────────────
function polygonStyle(selected, categoryKey) {
  const color = categoryInfo(categoryKey).color;
  return selected
    ? { color: '#e05555', weight: 3, fillColor: color, fillOpacity: .45 }
    : { color, weight: 2, fillColor: color, fillOpacity: .3 };
}

function bindLayerEvents(id, layer) {
  layer.on('click', () => selectFeature(id));
}

function selectFeature(id) {
  // 이전 선택 해제
  if (selectedId) {
    const prev = features.find(f => f.id === selectedId);
    if (prev) prev.layer.setStyle(polygonStyle(false, prev.props.category));
  }
  selectedId = id;
  const feat = features.find(f => f.id === id);
  if (!feat) return;
  feat.layer.setStyle(polygonStyle(true, feat.props.category));

  // 속성 패널 채우기
  const p = feat.props;
  const category = p.category || 'school_forest';
  document.getElementById('f-category').value   = category;
  document.getElementById('f-name').value       = p.school_name || '';
  populateSubtypeSelect(category, p.school_type);
  document.getElementById('f-year').value       = p.established_year || '';
  document.getElementById('f-addr').value       = p.addr_parcel || '';
  document.getElementById('f-budget').value     = p.budget || '';
  document.getElementById('f-manager').value    = p.manager || '';
  document.getElementById('f-status').value     = p.care_status || '정상';
  document.getElementById('f-seq').value        = p.seq_no || '';
  document.getElementById('f-planting').value   = p.planting_detail || '';
  document.getElementById('f-facilities').value = p.facilities || '';
  document.getElementById('f-note').value       = p.note || '';
  document.getElementById('attr-area-display').textContent =
    p.area_m2 ? p.area_m2.toLocaleString() + ' ㎡' : '—';
  document.getElementById('attr-panel-title').textContent =
    p.school_name ? `📍 ${p.school_name}` : '정보 입력';

  document.getElementById('attr-panel').classList.remove('hidden');

  // 목록 하이라이트
  document.querySelectorAll('.list-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

let sortMode = 'name';

document.getElementById('sort-select').addEventListener('change', e => {
  sortMode = e.target.value;
  updateList();
});

function categoryOrderIndex(key) {
  const i = CATEGORIES.findIndex(c => c.key === key);
  return i === -1 ? CATEGORIES.length : i;
}
function byName(a, b) {
  return (a.props.school_name || '').localeCompare(b.props.school_name || '', 'ko');
}
function byYear(a, b) {
  const ya = parseInt(a.props.established_year) || 0;
  const yb = parseInt(b.props.established_year) || 0;
  return ya - yb || byName(a, b);
}

function sortedFeatures() {
  const arr = features.filter(f => visibleCategories.has(f.props.category || 'school_forest'));
  if (sortMode === 'year') {
    arr.sort(byYear);
  } else if (sortMode === 'category_name') {
    arr.sort((a, b) => categoryOrderIndex(a.props.category) - categoryOrderIndex(b.props.category) || byName(a, b));
  } else if (sortMode === 'category_year') {
    arr.sort((a, b) => categoryOrderIndex(a.props.category) - categoryOrderIndex(b.props.category) || byYear(a, b));
  } else {
    arr.sort(byName);
  }
  return arr;
}

function updateCategoryCounts() {
  CATEGORIES.forEach(c => {
    const n = features.filter(f => (f.props.category || 'school_forest') === c.key).length;
    const el = document.getElementById('cat-count-' + c.key);
    if (el) el.textContent = n;
  });
}

function updateList() {
  const wrap = document.getElementById('list-wrap');
  document.getElementById('count').textContent = features.length;
  document.getElementById('list-empty').style.display = features.length ? 'none' : '';
  updateCategoryCounts();

  // 삭제되어 더 이상 존재하지 않는 id는 체크 목록에서도 제거
  const liveIds = new Set(features.map(f => f.id));
  checkedIds.forEach(id => { if (!liveIds.has(id)) checkedIds.delete(id); });

  // 기존 아이템 제거
  wrap.querySelectorAll('.list-item').forEach(el => el.remove());

  const visible = sortedFeatures();

  visible.forEach(f => {
    const cat = categoryInfo(f.props.category);
    const el = document.createElement('div');
    el.className = 'list-item' + (f.id === selectedId ? ' active' : '');
    el.dataset.id = f.id;
    el.innerHTML = `

// ── 목록 다중 선택(체크박스) 툴바 ─────────────────────────
function updateBulkUI(visible) {
  visible = visible || sortedFeatures();
  const n = checkedIds.size;
  const delBtn = document.getElementById('bulk-delete-btn');
  document.getElementById('bulk-count').textContent = n;
  delBtn.style.display = n > 0 ? 'inline-block' : 'none';

  const selectAll = document.getElementById('select-all-check');
  const visibleChecked = visible.filter(f => checkedIds.has(f.id)).length;
  selectAll.checked = visible.length > 0 && visibleChecked === visible.length;
  selectAll.indeterminate = visibleChecked > 0 && visibleChecked < visible.length;
}

document.getElementById('select-all-check').addEventListener('change', e => {

  if (e.target.checked) visible.forEach(f => checkedIds.add(f.id));

});

document.getElementById('bulk-delete-btn').addEventListener('click', () => {
  if (!checkedIds.size) return;
  if (!confirm(`선택한 ${checkedIds.size}개 항목을 삭제할까요?`)) return;
  checkedIds.forEach(id => {
    const idx = features.findIndex(f => f.id === id);
    if (idx < 0) return;
    removeFromCategory(features[idx].layer, features[idx].props.category);

// ── GeoJSON 빌드 (저장/자동저장/공유용 내보내기 공통) ────
function buildGeoJSON() {
  return {
    type: 'FeatureCollection',
    name: '고양시_도시숲_대장',
    generated: new Date().toISOString(),
    features: features.map(f => {
      const latlngs = f.layer.getLatLngs()[0];
      const coords  = latlngs.map(ll => [ll.lng, ll.lat]);
      coords.push(coords[0]); // 폐합
      return {
        type: 'Feature',
        geometry: { type: 'Polygon', coordinates: [coords] },
        properties: { ...f.props }
      };
    })
  };
}

// ── GeoJSON 파싱 (localStorage·내장 데이터 복원 공통) ────
function loadGeoJSON(geojson) {
  const fcs = geojson.type === 'FeatureCollection' ? geojson.features : [geojson];
  let count = 0;
  fcs.forEach(f => {
    if (f.geometry?.type !== 'Polygon' && f.geometry?.type !== 'MultiPolygon') return;
    const coords = f.geometry.type === 'Polygon'
      ? f.geometry.coordinates[0]
      : f.geometry.coordinates[0][0];
    const latlngs = coords.map(([lng, lat]) => [lat, lng]);
    const id       = f.properties?.id || uid();
    const category = f.properties?.category || 'school_forest';
    const layer = L.polygon(latlngs, polygonStyle(false, category));
    addToCategory(layer, category);
    const areaM2 = f.properties?.area_m2 || Math.round(calcAreaM2(layer.getLatLngs()));
    const props = { area_m2: areaM2, created: today(), updated: today(), category: 'school_forest', ...f.properties, id };

    // 기존 ID가 있으면 교체
    const existingIdx = features.findIndex(x => x.id === id);
    if (existingIdx >= 0) {
      removeFromCategory(features[existingIdx].layer, features[existingIdx].props.category);
      features.splice(existingIdx, 1);
    }

    features.push({ id, props, layer });
    if (props.school_name) {
      layer.bindTooltip(props.school_name, { permanent: false, direction: 'center' });
    }
    bindLayerEvents(id, layer);
    count++;
  });

  updateList();
  if (features.length) map.fitBounds(allFeaturesBounds(), { padding: [40, 40] });
  saveToStorage();
  badge(`${count}개 데이터 불러오기 완료`, 3000);
}

// ── 자동 저장/복원 (localStorage — 이 PC·이 브라우저 한정) ─
// 등록/수정/삭제할 때마다 호출되어, 새로고침해도 이 브라우저에서는 데이터가 남음.
// 단, 다른 사람에게 파일을 공유할 때는 아래 "공유용 HTML 내보내기"를 써야 함
// (localStorage는 파일이 아니라 브라우저에 저장되는 것이라 다른 PC로 전달되지 않음).
//
// 공유용으로 내보낸 파일은 share-id를 심어 STORAGE_KEY를 원본과 다르게 분리한다.
// 그래야 원본 작업 파일과 같은 브라우저/같은 로컬서버(origin)에서 열어도
// 예전에 저장된(카테고리 일부만 있을 수 있는) localStorage 캐시를 잘못 덮어쓰지 않고
// 내보내기 시점에 심어둔 전체 데이터(embedded-data)가 항상 정확히 표시된다.
function loadShareId() {
  const el = document.getElementById('share-id');
  if (!el) return null;
  try {
    const v = JSON.parse(el.textContent);
    return (typeof v === 'string' && v) ? v : null;
  } catch (e) { return null; }
}

const SHARE_ID = loadShareId();
const STORAGE_KEY = 'goyang_school_forest_data' + (SHARE_ID ? ('_share_' + SHARE_ID) : '');

function saveToStorage() {
  if (!features.length) { localStorage.removeItem(STORAGE_KEY); return; }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(buildGeoJSON()));
}

// ── 파일에 데이터 내장 (공유용 HTML 내보내기) ─────────────
// 이 html을 처음 열었을 때(스크립트 실행 최초 시점)의 순수 원본을 기억해 둔다.
// 이후 "공유용 HTML로 내보내기"를 누르면, 이 원본에 현재 데이터를 끼워넣어
// 새 html 파일로 저장한다 — 그 파일은 누가 열든 클릭 없이 데이터가 바로 보인다.
function loadEmbeddedData() {
  const el = document.getElementById('embedded-data');
  if (!el) return null;
  try {
    const data = JSON.parse(el.textContent);
    return (data && data.type === 'FeatureCollection') ? data : null;
  } catch (e) { return null; }
}

function initData() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { loadGeoJSON(JSON.parse(stored)); return; } catch (e) { console.error('localStorage 복원 실패', e); }
  }
  const embedded = loadEmbeddedData();
  if (embedded) loadGeoJSON(embedded);
}

// 행에서 컬럼 값 찾기 (여러 후보 컬럼명 허용)
function getCol(row, ...candidates) {
  for (const key of Object.keys(row)) {
    if (candidates.some(c => key.includes(c))) return String(row[key] ?? '').trim();
  }
  return '';
}

// 행에서 소재지 주소 구성 (도로명 주소 우선)
function buildAddrFromRow(row) {
  let addr = getCol(row, '소재지', '주소', 'address', '지번주소');
  if (!addr || addr.length < 5) return '';
  // 시도 자동 보정
  if (/^(덕양구|일산동구|일산서구)/.test(addr)) addr = '경기도 고양시 ' + addr;
  else if (/^고양시/.test(addr)) addr = '경기도 ' + addr;
  return addr;
}

// 주소 → 좌표 (road / parcel / 타입없음 순서로 모두 시도)
async function geocodeAddr(addr) {
  const isRoad = /로\s*\d|길\s*\d|대로\s*\d|번길/.test(addr);
  // 도로명이면 road 먼저, 지번이면 parcel 먼저, 마지막엔 타입 없이도 시도
  const types = isRoad ? ['road', 'parcel', ''] : ['parcel', 'road', ''];
  const attempts = [];

  for (const type of types) {
    try {
      const typeParam = type ? `&type=${type}` : '';
      const url = `${VWORLD_BASE}/req/address?service=address&request=getcoord` +
        `&version=2.0&crs=epsg:4326&key=${API_KEY}` +
        `&address=${encodeURIComponent(addr)}${typeParam}&format=json&errorformat=json`;
      const r = await fetch(url);
      const d = await r.json();
      const status = (d.response?.status || '').toUpperCase();
      if (status === 'OK' && d.response?.result?.point) {
        const lng = parseFloat(d.response.result.point.x);
        const lat = parseFloat(d.response.result.point.y);
        return { lng, lat, parcelAddr: addr, usedType: type || 'none' };
      }
      // 실패 시 응답 내용 기록
      const errText = d.response?.error?.text || d.response?.error?.code || '(사유 없음)';
      attempts.push(`type=${type || 'none'} → status=${status || '응답없음'} ${errText}`);
      console.debug(`[getcoord type=${type||'none'}] status=${status}`, d.response?.error);
    } catch (e) {
      attempts.push(`type=${type || 'none'} → 네트워크/파싱 오류: ${e.message}`);
      console.debug(`[getcoord type=${type||'none'} 예외]`, e.message);
    }
  }
  throw new Error(`좌표 변환 실패: "${addr}"\n${attempts.join('\n')}`);
}

// 좌표 → 지번 주소 (역지오코딩, 단건 검색용)
async function reverseToParcel(lng, lat) {
  try {
    const url = `${VWORLD_BASE}/req/address?service=address&request=getaddress` +
      `&version=2.0&crs=epsg:4326&key=${API_KEY}` +
      `&point=${lng},${lat}&type=parcel&format=json&errorformat=json`;
    const r = await fetch(url);
    const d = await r.json();
    if ((d.response?.status || '').toUpperCase() === 'OK' && d.response?.result?.length) {
      return d.response.result[0].text || '';
    }
  } catch (_) {}
  return '';
}

// 학교명에서 학교 구분 자동 감지
function detectSchoolType(name) {
  if (name.includes('초등학교')) return '초등학교';
  if (name.includes('중학교'))   return '중학교';
  if (name.includes('고등학교')) return '고등학교';
  if (name.includes('대학교'))   return '대학교';
  return '기타';
}

// 점(lng,lat)이 폴리곤 링 내부에 있는지 판정 (ray casting)
function pointInRing(lng, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// 좌표 → 필지 폴리곤 (BBOX 방식 — CQL_FILTER 대신)
async function fetchParcelBBOX(lng, lat) {
  const d = 0.0003;
  const bboxOptions = [
    `${lng-d},${lat-d},${lng+d},${lat+d},EPSG:4326`,
    `${lat-d},${lng-d},${lat+d},${lng+d},EPSG:4326`,
  ];
  for (const layer of ['lt_c_lhpclp', 'lp_pa_cbnd_bonbun']) {
    for (const bbox of bboxOptions) {
      try {
        const url = `${VWORLD_BASE}/req/wfs?service=WFS&version=1.1.0&request=GetFeature` +
          `&typeName=${layer}&key=${API_KEY}&output=json&srsname=EPSG:4326` +
          `&BBOX=${encodeURIComponent(bbox)}&maxFeatures=5`;
        const r = await fetch(url);
        const data = await r.json();
        if (!data.features?.length) continue;

        // 1순위: 쿼리 좌표를 실제로 포함하는 필지 (옆 필지가 잘못 선택되는 것을 방지)
        // 2순위: 포함하는 필지가 없으면 가장 가까운 필지 (단, 100m 이내로 엄격히 제한)
        let nearest = null, nearestDist = Infinity;
        for (const feat of data.features) {
          const geom = feat.geometry;
          const ring = geom.type === 'Polygon' ? geom.coordinates[0]
                     : geom.type === 'MultiPolygon' ? geom.coordinates[0][0] : null;
          if (!ring) continue;
          if (pointInRing(lng, lat, ring)) return geom;
          const clng = ring.reduce((s, c) => s + c[0], 0) / ring.length;
          const clat = ring.reduce((s, c) => s + c[1], 0) / ring.length;
          const dist = Math.sqrt((clng-lng)**2 + (clat-lat)**2);
          if (dist < nearestDist) { nearestDist = dist; nearest = geom; }
        }
        if (nearest && nearestDist < 0.001) return nearest;
      } catch (_) {}
    }
  }
  return null;
}

// props 객체 생성 공통 함수
function buildProps(id, addr, props, areaM2) {
  const category = props.category || 'school_forest';
  return {
    id, addr_parcel: addr || '', pnu: '', seq_no: props.seq || '',
    category,
    school_name: props.name || '', school_type: props.type || (SUBTYPE_OPTIONS[category] || ['기타'])[0],
    established_year: props.year || '', area_m2: areaM2 || props.area || 0,
    budget: props.budget || '', planting_detail: props.planting || '',
    facilities: props.facilities || '', manager: '', care_status: '정상',
    note: props.note || '', created: today(), updated: today()
  };
}

// 엑셀 "종류" 컬럼 값 → 대분류 + 세부구분 결정
function resolveCategoryAndSubtype(typeRaw, schoolName, fallbackCategory) {
  const category = detectCategory(typeRaw) || fallbackCategory || 'school_forest';
  let subtype;
  if (category === 'school_forest') {
    subtype = detectSchoolType(schoolName || '');
  } else {
    subtype = (typeRaw && typeRaw.trim()) ? typeRaw.trim() : (SUBTYPE_OPTIONS[category] || ['기타'])[0];
  }
  return { category, subtype };
}

// 필지 경계 없을 때 임시 사각형 폴리곤 (점선, 주황색 = 편집 필요)

}

// Excel 행 일괄 처리

  try {
    const testCoord = await geocodeAddr(previewAddr);
    console.log(`[진단 OK] 첫행: ${previewName} → (${testCoord.lng.toFixed(5)}, ${testCoord.lat.toFixed(5)}) type=${testCoord.usedType}`);
  } catch (e) {
    console.error('[진단 실패]', e.message);
    const proceed = confirm(
      `⚠ 첫 번째 행 주소 검색 실패\n\n학교명: ${previewName}\n검색한 주소: "${previewAddr}"\n오류: ${e.message}\n\n` +
      `이 행만 실패한 것일 수 있습니다. 나머지 행은 계속 시도할까요?\n` +
      `("취소"를 누르면 전체 등록을 중단합니다.)`
    );
    if (!proceed) return;
  }

  let done = 0, ok = 0, fail = 0;
  const total = rows.length;

  for (const row of rows) {
    done++;
    badge(`처리 중 ${done}/${total} — 등록: ${ok}개`);

    const name = getCol(row, '학교명', '시설명', '이름', 'name');
    const typeRaw = getCol(row, '종류', '대분류', '분류', 'category');
    const resolved = resolveCategoryAndSubtype(typeRaw, name, getSelectedAddCategory());
    const props = {
      seq:        getCol(row, '연번', 'seq'),
      name,
      category:   resolved.category,
      type:       resolved.subtype,
      year:       getCol(row, '조성년도', '조성연도', '연도', 'year'),
      area:       parseInt(getCol(row, '면적', 'area')) || 0,
      budget:     getCol(row, '소요예산', '예산', 'budget'),
      planting:   getCol(row, '식재내역', '식재', 'planting'),
      facilities: getCol(row, '시설물내역', '시설물', 'facilities'),
      note:       getCol(row, '비고', '메모', 'note'),
    };

    // 학교명 없는 빈 행 skip
    if (!props.name) { fail++; continue; }

    try {
      const addr = buildAddrFromRow(row);

      if (!addr) {
        // 주소 없어도 학교명은 목록에 추가 (위치 미확정)
        console.warn(`[주소 없음] ${props.name}`);
        addNoCoordEntry(props);
        ok++;
        continue;
      }

      let coord;
      try {
        coord = await geocodeAddr(addr);
        console.log(`[변환 성공] ${props.name}: "${addr}" → 지번: "${coord.parcelAddr}" (${coord.lng.toFixed(5)}, ${coord.lat.toFixed(5)})`);
      } catch (geoErr) {
        console.warn(`[주소 변환 실패] ${props.name}: ${addr} — ${geoErr.message}`);
        fail++;
        continue;
      }

      // 고양시 범위 확인
      const inGoyang = coord.lat >= 37.55 && coord.lat <= 37.80 && coord.lng >= 126.65 && coord.lng <= 127.00;
      if (!inGoyang) {
        console.warn(`[고양시 범위 외] ${props.name}: 위도 ${coord.lat.toFixed(5)}, 경도 ${coord.lng.toFixed(5)}`);
        fail++;
        continue;
      }

      // 지번 주소 사용 (도로명 → 변환된 지번)
      const finalAddr = coord.parcelAddr || addr;

      const geom = await fetchParcelBBOX(coord.lng, coord.lat);
      if (geom) {
        const ring = geom.type === 'Polygon' ? geom.coordinates[0] : geom.coordinates[0][0];
        const ll   = ring.map(([gLng, gLat]) => [gLat, gLng]);
        const id   = uid();
        const areaM2 = props.area || null;
        const p = buildProps(id, finalAddr, props, areaM2);
        const layer = L.polygon(ll, polygonStyle(false, p.category));
        addToCategory(layer, p.category);
        p.area_m2 = p.area_m2 || Math.round(calcAreaM2(layer.getLatLngs()));
        features.push({ id, props: p, layer });
        bindLayerEvents(id, layer);
        if (p.school_name) layer.bindTooltip(p.school_name, { permanent: false });
      } else {
        addPendingPolygon(coord.lat, coord.lng, finalAddr, props);
      }
      ok++;
    } catch (e) {
      console.error(`[행 오류] ${props.name}:`, e);
      fail++;
    }
    await new Promise(r => setTimeout(r, 400));
  }

  updateList();
  if (features.length) map.fitBounds(allFeaturesBounds(), { padding: [40, 40] });
  saveToStorage();
  badge(`✅ 완료 — ${ok}개 등록, ${fail}개 실패 (F12 콘솔에서 상세 확인)`, 8000);
}

    [4,'유아숲','OO유아숲체험원',2021,'고양시 일산동구 OO로 10',38000,560,'', '유아 놀이시설 등',''],
    ['','','','','','','','','',''],
    ['※ 소재지: 도로명 주소 전체 입력 (예: 고양시 일산서구 강선로 29)','','','','','','','','',''],
    ['※ 경기도 없이 "고양시"로 시작해도 자동 보정됩니다.','','','','','','','','',''],
    ['※ 종류: 학교숲 / 쌈지공원 / 유아숲 / 도심숲·자녀안심그린숲·가로화단 / 맑은하천 푸른숲길 / 옥상녹화·그린커튼·벽면녹화 중 입력 (미입력 시 사이드바 "등록 대상 분류"로 적용)','','','','','','','','',''],
  ];
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = [{wch:6},{wch:8},{wch:18},{wch:8},{wch:32},{wch:10},{wch:8},{wch:30},{wch:18},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws, '도시숲현황');
  XLSX.writeFile(wb, '도시숲_등록양식.xlsx');
}

document.getElementById('excel-btn').addEventListener('click', () => {
  document.getElementById('excel-input').click();
});
document.getElementById('template-btn').addEventListener('click', downloadTemplate);
document.getElementById('excel-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const wb  = XLSX.read(buf);
    const ws  = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
    console.log('[Excel 파싱]', rows.length, '행', rows[0]);
    if (!rows.length) { alert('데이터가 없습니다.'); return; }
    if (!confirm(`${rows.length}개 항목을 일괄 등록합니다.\n(항목당 약 0.5초 소요 → 총 ${Math.ceil(rows.length*0.5)}초 예상)\n\n계속할까요?`)) return;
    await processExcelRows(rows);
  } catch (err) {
    alert('파일 읽기 오류: ' + err.message);
  }
  e.target.value = '';
});
